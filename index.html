<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche App Factory</title>
<meta name="description" content="Niche App Factory: küçük ve odaklı mobil uygulamalar geliştiren bağımsız bir geliştirici.">
<meta name="robots" content="index,follow">
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #16242e; --muted: #5a6b78;
    --accent: #1d4256; --line: #dbe2e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a21; --card: #16242e; --text: #e8eef2; --muted: #a9c2d1;
      --accent: #a9c2d1; --line: #2a3b47;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  header { padding: 8px 0 16px; }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 4px; color: var(--accent); }
  h2 { font-size: 1.15rem; margin: 0 0 8px; color: var(--accent); }
  p, li { margin: 0 0 10px; }
  ul { padding-left: 22px; margin: 0 0 10px; }
  .meta { color: var(--muted); font-size: 0.92rem; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px 20px 12px; margin-top: 16px;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>

<header>
  <h1>Niche App Factory</h1>
  <p class="meta">Küçük ve odaklı mobil uygulamalar geliştiren bağımsız bir geliştirici.</p>
</header>

<section class="card">
  <h2>AvRadar</h2>
  <p>Olta atmadan önce hava, dalga, ay fazı ve en uygun av saatlerine tek ekranda bak.</p>
  <ul>
    <li><a href="/avradar/gizlilik/">Gizlilik politikası</a></li>
    <li><a href="/avradar/hesap-silme/">Hesap ve veri silme</a></li>
  </ul>
</section>

<section class="card">
  <h2>İletişim</h2>
  <p><a href="mailto:nicheappfactory.support@gmail.com">nicheappfactory.support@gmail.com</a></p>
</section>

</main>
</body>
</html>
